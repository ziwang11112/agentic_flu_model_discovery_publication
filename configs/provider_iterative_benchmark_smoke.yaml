seed: 42
scope: provider_iterative_benchmark_smoke

artifacts:
  root_dir: artifacts_provider_iterative_benchmark_compact

data:
  frozen_artifact_root: artifacts_discovery_ablation

provider_settings:
  providers:
    - name: openai_gpt
    - name: anthropic_claude
    - name: google_gemini
    - name: deepseek

allow_provider_skip: true
require_min_real_providers: 1

series:
  - 0-4 yr

repeats: 1
rounds: 2
candidates_per_round: 2
budgets:
  - 2
  - 4

frozen_replay: true
bounded_execution: false
include_baseline_proposers: true

policy:
  epsilon: 0.01

candidate_allowlist:
  - last_observed
  - rolling_mean_4wk
  - arima_auto_small
  - deterministic_seir
  - delayed_observation_seir
  - constrained_structure_discovery
  - no_observation_search_discovery
  - validation_only_structure_selection
  - random_structure_discovery
  - exhaustive_structure_discovery
