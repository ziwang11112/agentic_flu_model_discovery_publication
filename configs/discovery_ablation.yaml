seed: 42

data:
  raw_csv: FluSurveillance_Custom_Download_Data.csv
  processed_dir: data/processed_discovery_ablation
  include_age_robustness: true
  season_mode: pooled
  seasons: []
  age_groups:
    - 0-4 yr
    - 5-17 yr
    - 18-49 yr
    - 50-64 yr
    - ">= 65 yr"

artifacts:
  root_dir: artifacts_discovery_ablation

benchmark:
  models:
    - last_observed
    - rolling_mean_2wk
    - rolling_mean_4wk
    - arima_auto_small
    - lagged_ridge
    - lagged_gradient_boosting
    - deterministic_seir
    - probabilistic_seir
    - hospitalized_seihr
    - delayed_observation_seir
    - fractional_seir
    - constrained_structure_discovery
    - random_structure_discovery
    - exhaustive_structure_discovery
    - validation_only_structure_selection
    - no_observation_search_discovery
    - no_stability_discovery
    - equal_weight_point_ensemble
  ensemble_members:
    - last_observed
    - rolling_mean_2wk
    - rolling_mean_4wk
    - arima_auto_small
    - lagged_ridge
    - lagged_gradient_boosting
    - deterministic_seir
    - probabilistic_seir
    - hospitalized_seihr
    - delayed_observation_seir
    - fractional_seir
    - constrained_structure_discovery

fitting:
  n_restarts: 6
  rolling_n_restarts: 1
  maxiter: 250
  negative_penalty: 10000.0
  mass_penalty: 10000.0
  prior_weight: 0.001
  laplace_draws: 150
  uncertainty_method: bootstrap
  bootstrap_draws: 30
  bootstrap_n_restarts: 0
  calibrate_intervals: false
  interval_calibration_method: conformal
  calibration_draws: 12
  calibration_scale_min: 0.25
  calibration_scale_max: 1.25
  calibration_scale_grid_size: 41

uncertainty:
  conformal:
    enabled: true
    output_dir: artifacts_conformal_generated
    calibration_kinds:
      - raw
      - scale_calibrated
      - conformal_absolute
      - conformal_standardized
      - conformal_asymmetric
    interval_levels:
      - 50
      - 80
      - 95
    residual_source: rolling_validation
    prefer_horizon_specific: true
    horizon_fallback: pooled_across_horizons
    min_calibration_points: 20
    fallback_pooling: age_family
    eps: 1.0e-8
    lower_bound: 0.0
    winner_split: validation
    test_is_evaluation_only: true
    winner_undercoverage_floor: -0.05
    winner_interval_score_weight: 0.25
    age_families:
      children:
        - 0-4 yr
        - 5-17 yr
      adults:
        - 18-49 yr
        - 50-64 yr
      older_adults:
        - ">= 65 yr"
      overall:
        - Overall

evaluation:
  horizons:
    - 1
    - 2
    - 4

discovery:
  beam_width: 5
  max_rounds: 20
  patience: 5
  rolling_horizons:
    - 1
    - 2
    - 4
  multi_split_blocks: 3
  random_candidate_budget: 30
  random_repeats: 1
  exhaustive_max_candidates: 200
  allow_truncated_exhaustive: false
  score_param_weight: 0.01
  score_compartment_weight: 0.02
  score_fractional_weight: 0.015
  score_observation_weight: 0.005
  score_delay_weight: 0.005
  score_h_observation_weight: 0.005
  score_recurrence_weight: 0.01
  score_stability_weight: 0.2
  score_multi_split_std_weight: 0.5
  raw_l2_weight: 0.0005
  seasonality_l2_weight: 0.005
  rho_l2_weight: 0.002
  init_l2_weight: 0.002
  fractional_alpha_weight: 0.002
  use_age_prior: true
  age_prior_simple_bonus: 0.01
  age_prior_recurrence_bonus: 0.01
  age_prior_fractional_bonus: 0.005
